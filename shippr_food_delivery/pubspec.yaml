name: shippr_food_delivery
description: A comprehensive food delivery app like ShippFR with ordering, payment, cart, and delivery features

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  provider: ^6.1.1
  get: ^4.6.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  intl: ^0.18.1
  flutter_rating_bar: ^4.0.1
  flutter_local_notifications: ^16.2.0
  razorpay_flutter: ^1.3.6
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700